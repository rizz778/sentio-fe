services:
  - type: web
    name: sentio-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_GATEWAY_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
      - key: VITE_GEMINI_WS_AUDIO_URL
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
